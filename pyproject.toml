[project]
name = "sqlalchemy-sessionload"
description = "SQLAlchemy load option that loads only from persisted session instances"
authors = [{ name = "Jan Vollmer", email = "jan@vllmr.dev" }]
license = { file = "LICENSE" }
dependencies = ["sqlalchemy>=2.1.8"]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["sqlalchemy", "session", "loader"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Plugins",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/jvllmr/sqlalchemy-sessionload"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
test = "pytest"
cov = "pytest --cov --cov-report=xml"
benchmark = "pytest --benchmark-json benchmark.json"
post_install = "prek install"

[tool.pycln]
all = true

[tool.mypy]
python_version = "3.11"
files = ["src/sqlalchemy_sessionload", "tests"]

[tool.pyaphid]
forbidden = ["print"]

[tool.ruff.lint]
ignore = ["E731"]

[dependency-groups]
dev = [
  "black>=26.10.1",
  "mypy>=2.4.1",
  "ruff>=0.17.4",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "isort>=9.0.2",
  "pycln>=2.6.1",
  "pyaphid>=0.3.1",
  "faker>=40.44.0",
  "pytest-benchmark>=5.3.1",
  "nox>=2026.10.20",
  "types-sqlalchemy-utils>=1.1.0",
  "prek>=0.5.10",
]
